<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方块人 · 体型与动作</title><link rel="icon" href="data:,"><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script><style>*{box-sizing:border-box}body{margin:0;background:#e9f0e9;color:#234c4c;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:980px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}h1{font-size:25px;margin:5px 0}small{color:#5f8277;font-size:11px;letter-spacing:1px}header a{color:#2c7779;font-size:12px}#stage{height:min(66vh,610px);min-height:340px;border-radius:24px;overflow:hidden;border:1px solid #bed2c8;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}.tag{position:absolute;top:18px;left:18px;background:#fffc;padding:8px 11px;border-radius:20px;font-size:11px}.view-controls,.pose-controls{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}button{border:1px solid #bfd3c9;background:#fff8;color:#3d6a62;border-radius:11px;padding:10px 15px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#277f84;color:white;border-color:#277f84}.notes{display:flex;justify-content:space-between;gap:15px;font-size:11px;color:#5e7f71;line-height:1.8}.notes span{display:block}#facts{font-size:10px;opacity:.7}@media(max-width:600px){main{padding:14px}h1{font-size:21px}header a{font-size:10px}#stage{height:62vh}.view-controls,.pose-controls{gap:6px;margin:10px 0}button{font-size:12px;padding:9px 11px}.notes{display:block;font-size:10px}}</style></head><body><main><header><div><small>SIMPLE GRASS FLIGHT · R2.0</small><h1>方块人 · 造型与动作</h1></div><a href="/">回到游戏 ↗</a></header><div id="stage"><canvas id="canvas" aria-label="方块人立体模型，拖动可旋转"></canvas><span class="tag" id="view-name">正面 · 全身</span></div><div class="pose-controls" aria-label="人物外观"><button data-style="suit" aria-pressed="true">方块主角</button></div><div class="pose-controls" aria-label="成长体型"><button data-power="0" aria-pressed="true">初始体型</button><button data-power="80">微胖</button><button data-power="1000">圆滚滚</button><button data-power="10000">最大体型</button></div><div class="view-controls" aria-label="人物视角"><button data-view="front" aria-pressed="true">正面</button><button data-view="side" aria-pressed="false">侧面</button><button data-view="back" aria-pressed="false">背面</button><button data-view="threequarter" aria-pressed="false">三分之四</button></div><div class="pose-controls" aria-label="人物动作"><button data-pose="stand" aria-pressed="true">站立</button><button data-pose="walk" aria-pressed="false">跑步</button><button data-pose="eat" aria-pressed="false">吃东西</button><button data-pose="anticipate" aria-pressed="false">蓄力</button><button data-pose="land" aria-pressed="false">落地缓冲</button><button data-pose="fly" aria-pressed="false">飞行</button><button data-pose="cheer" aria-pressed="false">欢呼</button></div><div class="pose-controls"><button id="pose-pause" aria-pressed="false">暂停动作</button><label style="display:flex;align-items:center;gap:8px;font-size:12px">动作进度<input id="pose-time" aria-label="动作进度" type="range" min="0" max="84" step="1" value="0" style="width:150px"></label></div><div class="notes"><div><span>与游戏共用同一人物网格、材质与动作。</span><span>吃东西后，同一件衣服与身体连续变圆</span></div><div><span>拖动旋转视角，点击按钮检查轮廓和关节。</span><span id="facts"></span></div></div></main><script type="module" src="/character-review.js"></script></body></html>
