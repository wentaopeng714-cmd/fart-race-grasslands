<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#82d9e9"><title>屁力运动会 · 社区运动场</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💨%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script></head>
<body><main id="game" aria-label="屁力社区运动场"><canvas id="world" aria-label="3D社区运动场，拖动旋转视角"></canvas>
<div id="loading"><div class="spinner">💨</div><b>正在进入社区运动场…</b><span>准备运动补给、座驾与空中跑道</span></div>
<div id="hud" class="hidden">
 <header id="balances"><div class="balance gold"><span class="coin-icon">☺</span><div><small>金币</small><b id="coins">2</b></div></div><div class="balance power"><span class="poop-icon">💩</span><div><small>放屁能量</small><b id="power">0</b></div></div></header>
 <div id="status"><button id="room" aria-label="联机房间与邀请">联机房间</button><button id="sound" aria-label="切换声音">♪</button><button id="camera-reset" aria-label="重置镜头">↺</button></div>
 <nav id="nav" aria-label="成长菜单"></nav>
 <aside id="autos"><button id="auto-eat" class="auto" aria-pressed="false"><span>👄</span><b>自动<br>进食</b><i>关</i></button><button id="auto-race" class="auto" aria-pressed="false"><span>💨</span><b>自动<br>挑战</b><i>关</i></button></aside>
 <div id="round-banner" class="hidden"><small id="round-label">个人挑战</small><strong id="countdown">3</strong></div>
 <div id="flight-readout" class="hidden"><small>本次飞行</small><b id="flight-distance">0 m</b><span id="flight-rank">继续向前！</span></div>
 <div id="boost-controls" class="hidden"><div id="boost-feedback" role="status">瞄准金色格，喷气更远！</div><div id="boost-meter" role="meter" aria-label="喷气时机" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span><i id="boost-needle"></i></div><button id="boost"><span>💨</span><b>喷气加速 ×3</b><small>点击 / 空格 · 金格完美喷气 +8%</small></button></div>
 <div id="gains" aria-hidden="true"></div><div id="toast" role="status"></div>
 <div id="nearby" class="hidden"><span id="nearby-label"></span><button id="interact">进入</button></div>
 <p id="hint">左下移动 · 拖动空白处转镜头 · 点击吃东西</p>
 <div id="controls"><div id="joystick" role="slider" aria-label="移动摇杆"><div class="joystick-lines"></div><div id="stick"></div></div><button id="go-race"><span>🏁</span><b>去喷气</b></button><button id="eat"><span>👄</span><b>吃东西</b><small id="eat-gain">+1 能量</small></button></div>
 <div id="connection" class="hidden">正在重新连接社区运动场…</div>
</div>
<section id="intro"><div class="logo"><small>邻 里 运 动 场</small><h1>屁力运动会<span>NEIGHBORHOOD GAMES</span></h1></div><div class="intro-card"><h2>吃得更强，飞得更远！</h2><p>先吃食物攒能量，跑向起跑线，<br>独自爆发喷气，点准时机飞得更远！</p><button id="start">进入社区运动场 <span>➜</span></button><small>竖屏 · 真人房间 · 进度自动保存</small></div></section>
<div id="modal-shade" class="hidden"><section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><h2 id="modal-title"></h2><button id="close-modal" aria-label="关闭菜单">×</button></header><div id="modal-body"></div></section></div>
<div id="hatch" class="hidden" role="dialog" aria-modal="true" aria-label="开蛋结果"><div class="hatch-rays"></div><div class="hatch-content"><small id="hatch-label">孵化成功！</small><img id="hatch-image" alt="获得的宠物"><h2 id="hatch-name"></h2><b id="hatch-mult"></b><p id="hatch-rarity"></p><button id="hatch-close">太棒了！</button></div></div>
<div id="confetti" aria-hidden="true"></div>
</main><script type="module" src="/game.js"></script></body></html>
